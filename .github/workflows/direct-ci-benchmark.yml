name: Full direct-runner repeatability experiment

on:
  push:
    branches: [ci/cache-benchmark]
    paths: [.github/workflows/direct-ci-benchmark.yml, Scripts/benchmark_direct_ci.py]

permissions:
  contents: read

env:
  CI_CACHE_PRODUCT_BASE: 93fd95b1cbab995d994c4f66759d0c2525c22383

jobs:
  repeat:
    if: ${{ github.repository == 'Yuxin-Qiao/CodexBar' }}
    name: Full inventory repetition ${{ matrix.repetition }}
    runs-on: macos-26
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select fixed Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer" >> "$GITHUB_ENV"
          echo "CI_CACHE_BENCH_DIR=$RUNNER_TEMP/direct-experiment" >> "$GITHUB_ENV"
      - name: Verify hardened input-cache regressions
        run: python3 Scripts/test_ci_swiftpm_cache.py
      - name: Prepare the complete offline product inventory
        run: python3 Scripts/benchmark_direct_ci.py prepare
      - name: Restore frozen product baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .build
          key: cache-experiment-37871366393-xcode26.6-1b736048dab146887ec901227c36b2a6bc2efabdf05990123d908f50e9b5123e
          fail-on-cache-miss: true
      - name: Verify changed source with preserved timestamps compiles correctly
        run: python3 Scripts/benchmark_direct_ci.py probe
      - name: Run entire inventory with two direct workers
        timeout-minutes: 60
        run: python3 Scripts/benchmark_direct_ci.py case --seed-context 1b736048dab146887ec901227c36b2a6bc2efabdf05990123d908f50e9b5123e
      - name: Retain full inventory, timings and behavior
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: direct-full-repetition-${{ matrix.repetition }}
          path: ${{ env.CI_CACHE_BENCH_DIR }}
          retention-days: 14

  compatibility-correctness:
    if: ${{ github.repository == 'Yuxin-Qiao/CodexBar' }}
    name: Backdated input correctness on Xcode 26.3
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select fixed Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer" >> "$GITHUB_ENV"
          echo "CI_CACHE_BENCH_DIR=$RUNNER_TEMP/direct-experiment" >> "$GITHUB_ENV"
      - name: Verify metadata and compiled behavior
        run: |
          python3 Scripts/test_ci_swiftpm_cache.py
          python3 Scripts/benchmark_direct_ci.py probe
      - name: Retain compiled behavior proof
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: backdated-correctness-xcode26.3
          path: ${{ env.CI_CACHE_BENCH_DIR }}
          retention-days: 14
